services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estateflow
      POSTGRES_USER: estateflow
      POSTGRES_PASSWORD: local-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_NAME: estateflow
      DB_USER: estateflow
      DB_PASSWORD: local-dev-only
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8088:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
